name: Build & Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Quality gate must pass before any packaging or release upload.
  quality:
    uses: ./.github/workflows/quality.yml

  build-win:
    name: Windows build + packaged smoke + release upload
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Electron smoke uses Playwright's Electron driver, not Chromium browsers
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Verify release tag matches source version
        run: node scripts/verify-release-source.cjs

      - name: Setup Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Build Laya sidecar
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-laya-sidecar.ps1

      - name: Sign Laya sidecar
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\sign-laya-sidecar.ps1
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_THUMBPRINT: ${{ secrets.WIN_CSC_THUMBPRINT }}

      - name: Verify signed Laya sidecar
        shell: pwsh
        run: node scripts/verify-laya-sidecar.cjs --require-signature

      - name: Build app (Vite)
        run: npx vite build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      # Publish only after smoke passes (upload step below). Never publish untested artifacts.
      - name: Build Windows (nsis + portable) — publish never
        run: npx electron-builder --win --publish never
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: List Windows artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'release') {
            Get-ChildItem -LiteralPath 'release' -Recurse -File | Select-Object FullName, Length
          } else {
            throw 'release/ directory missing after electron-builder'
          }

      - name: Packaged smoke — win-unpacked
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\packaged-feature-smoke.ps1 -Mode unpacked
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Packaged smoke — NSIS silent install
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\packaged-feature-smoke.ps1 -Mode nsis
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Laya sidecar runtime smoke
        shell: pwsh
        run: node scripts/smoke-laya-sidecar.cjs --root=release/win-unpacked/resources/laya-sidecar

      # Upload only after packaged smoke and the sidecar runtime smoke succeed.
      - name: Upload Windows artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: dotuanbn/mmo-auto-review-releases
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release/MMO-Auto-Review-Setup-*.exe
            release/MMO-Auto-Review-*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  build-mac:
    name: macOS build + release upload
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Verify release tag matches source version
        run: node scripts/verify-release-source.cjs

      - name: Build app (Vite)
        run: npx vite build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Build macOS (dmg + zip x64/arm64) — publish never
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: List artifacts (mac)
        run: ls -la release/*.dmg release/*.zip release/*.yml 2>/dev/null || echo "List done"

      - name: Upload macOS artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: dotuanbn/mmo-auto-review-releases
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release/MMO-Auto-Review-*.dmg
            release/MMO-Auto-Review-*.zip
            release/latest-mac.yml
            release/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
