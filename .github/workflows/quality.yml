name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: gate:quick + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Quality gate does not need Playwright browsers
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Quick gate (typecheck + lint)
        run: npm run gate:quick

      - name: Unit tests
        run: npm run test:run
